<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Registro - IW Digital</title>
  <script>
    async function loadApp() {
      try {
        const response = await fetch('./config.json');
        const config = await response.json();
        const url = `https://script.google.com/macros/s/${config.appsScriptId}/exec`;
        window.location.href = url;
      } catch (error) {
        document.body.innerHTML = '<p style="padding: 20px;">Cargando...</p>';
      }
    }
    loadApp();
  </script>
</head>
<body style="padding: 20px; text-align: center;">
  <p>Cargando dashboard...</p>
  <p><a href="#" onclick="loadApp()">Si no se abre automáticamente, haz click aquí</a></p>
</body>
</html>
