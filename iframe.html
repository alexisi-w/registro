<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - IW Digital</title>
</head>
<body style="margin: 0; padding: 0; background: #f5f5f5;">
  <iframe id="app" style="width: 100%; height: 100vh; border: none;"></iframe>
  <script>
    async function loadApp() {
      try {
        const response = await fetch('./config.json');
        if (!response.ok) throw new Error('Config no encontrado');
        const config = await response.json();
        document.getElementById('app').src = `https://script.google.com/macros/s/${config.appsScriptId}/exec`;
      } catch (error) {
        document.body.innerHTML = '<p style="padding: 20px; color: red;">⚠️ Error: ' + error.message + '</p>';
      }
    }
    loadApp();
  </script>
</body>
</html>
